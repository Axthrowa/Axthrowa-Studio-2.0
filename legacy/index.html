<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yayın Yönetim Aracı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Yayın Yönetim Aracı</h1>
    </div>
    <div class="topbar-actions">
      <a href="obs-giris-ekrani.html" class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center;">OBS Giriş</a>
      <a href="obs-cikis-ekrani.html" class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center;">OBS Çıkış</a>
      <button id="btnHistory" class="btn ghost" type="button">Geçmiş</button>
      <button id="btnTemplates" class="btn ghost" type="button">Şablonlar</button>
      <button id="btnSettings" class="btn ghost" type="button">Ayarlar</button>
      <button id="btnExport" class="btn ghost" type="button">Dışa Aktar</button>
      <button id="btnImport" class="btn ghost" type="button">İçe Aktar</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <main class="layout">

    <section class="panel form-panel">
      <h2>AI Önerileri</h2>
      <div class="field-row">
        <div class="field" style="flex:1;">
          <label for="aiCategorySelect">Kategori seçin, başlık/açıklama/etiket otomatik dolsun</label>
          <select id="aiCategorySelect"></select>
        </div>
      </div>
      <div class="form-actions" style="margin-top:0;margin-bottom:22px;">
        <button id="btnApplyAiSuggestion" class="btn" type="button">Öneriyi Uygula</button>
        <button id="btnShuffleAiSuggestion" class="btn ghost" type="button">Başka Öneri</button>
      </div>

      <h2>Genel Bilgiler</h2>

      <div class="field">
        <label for="fTitle">Yayın Başlığı</label>
        <input id="fTitle" type="text" maxlength="140" placeholder="Örn: Bugün ranked grind + izleyici oyunları!">
        <span class="hint"><span id="titleCount">0</span>/140</span>
      </div>

      <div class="field">
        <label for="fDescription">Açıklama</label>
        <textarea id="fDescription" rows="4" placeholder="Yayın hakkında kısa açıklama, sosyal medya linkleri vb."></textarea>
      </div>

      <div class="field">
        <label for="fTags">Etiketler</label>
        <input id="fTags" type="text" placeholder="virgülle ayırın: fps, türkçe, sohbet">
        <div id="tagPreview" class="chip-row"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fLanguage">Dil</label>
          <select id="fLanguage">
            <option value="tr">Türkçe</option>
            <option value="en">İngilizce</option>
            <option value="de">Almanca</option>
            <option value="es">İspanyolca</option>
            <option value="fr">Fransızca</option>
            <option value="ru">Rusça</option>
            <option value="ar">Arapça</option>
            <option value="other">Diğer</option>
          </select>
        </div>
        <div class="field">
          <label for="fSchedule">Planlanan Tarih/Saat</label>
          <input id="fSchedule" type="datetime-local">
        </div>
      </div>

      <div class="field">
        <label for="fThumb">Kapak Görseli (Thumbnail)</label>
        <input id="fThumb" type="file" accept="image/*">
        <div class="thumb-preview" id="thumbPreview">
          <span class="thumb-empty">Görsel seçilmedi</span>
        </div>
      </div>

      <h2 class="section-gap">Platforma Özel Ayarlar</h2>

      <div class="tabs">
        <button class="tab-btn active" data-platform="twitch" type="button">Twitch</button>
        <button class="tab-btn" data-platform="youtube" type="button">YouTube</button>
        <button class="tab-btn" data-platform="kick" type="button">Kick</button>
      </div>

      <div class="tab-panel" data-panel="twitch">
        <div class="field">
          <label for="twCategory">Kategori / Oyun</label>
          <input id="twCategory" type="text" list="gameList" placeholder="Örn: Just Chatting, League of Legends">
        </div>
        <div class="field-row">
          <label class="switch-row"><input type="checkbox" id="twMature"> <span>Yetişkin içerik (18+)</span></label>
          <label class="switch-row"><input type="checkbox" id="twBranded"> <span>Marka içerikli yayın</span></label>
        </div>
      </div>

      <div class="tab-panel hidden" data-panel="youtube">
        <div class="field">
          <label for="ytCategory">Kategori</label>
          <select id="ytCategory">
            <option>Oyun</option>
            <option>Eğlence</option>
            <option>Müzik</option>
            <option>Eğitim</option>
            <option>Bilim ve Teknoloji</option>
            <option>Spor</option>
            <option>Haberler ve Politika</option>
            <option>Sohbet</option>
          </select>
        </div>
        <div class="field">
          <label for="ytPrivacy">Gizlilik</label>
          <select id="ytPrivacy">
            <option value="public">Herkese Açık</option>
            <option value="unlisted">Listelenmemiş</option>
            <option value="private">Özel</option>
          </select>
        </div>
        <div class="field-row">
          <label class="switch-row"><input type="checkbox" id="ytKids"> <span>Çocuklara uygun içerik</span></label>
          <label class="switch-row"><input type="checkbox" id="ytMonetize" checked> <span>Gelir elde etme açık</span></label>
        </div>
      </div>

      <div class="tab-panel hidden" data-panel="kick">
        <div class="field">
          <label for="kkCategory">Kategori</label>
          <input id="kkCategory" type="text" list="gameList" placeholder="Örn: Just Chatting, Valorant">
        </div>
        <div class="field-row">
          <label class="switch-row"><input type="checkbox" id="kkMature"> <span>Yetişkin içerik (18+)</span></label>
        </div>
      </div>

      <datalist id="gameList">
        <option value="Just Chatting">
        <option value="League of Legends">
        <option value="Valorant">
        <option value="Counter-Strike 2">
        <option value="Minecraft">
        <option value="Fortnite">
        <option value="GTA V">
        <option value="Grand Theft Auto V">
        <option value="Call of Duty">
        <option value="Music">
        <option value="Art">
      </datalist>

      <div class="form-actions">
        <button id="btnSaveTemplate" class="btn ghost" type="button">Şablon Olarak Kaydet</button>
        <button id="btnSaveHistory" class="btn ghost" type="button">Geçmişe Kaydet</button>
        <button id="btnClear" class="btn danger" type="button">Formu Temizle</button>
      </div>
    </section>

    <section class="panel preview-panel">
      <h2>Önizleme &amp; Yayınlama</h2>

      <article class="platform-card" data-platform="twitch">
        <div class="platform-card-head">
          <span class="platform-badge twitch">Twitch</span>
          <button class="btn small" data-action="publish" data-platform="twitch" type="button">Yayınla</button>
        </div>
        <pre class="platform-output" id="out-twitch"></pre>
        <button class="btn small ghost" data-action="copy" data-platform="twitch" type="button">Panoya Kopyala</button>
      </article>

      <article class="platform-card" data-platform="youtube">
        <div class="platform-card-head">
          <span class="platform-badge youtube">YouTube</span>
          <button class="btn small" data-action="publish" data-platform="youtube" type="button">Yayınla</button>
        </div>
        <pre class="platform-output" id="out-youtube"></pre>
        <button class="btn small ghost" data-action="copy" data-platform="youtube" type="button">Panoya Kopyala</button>
      </article>

      <article class="platform-card" data-platform="kick">
        <div class="platform-card-head">
          <span class="platform-badge kick">Kick</span>
          <button class="btn small" data-action="publish" data-platform="kick" type="button">Yayınla</button>
        </div>
        <pre class="platform-output" id="out-kick"></pre>
        <button class="btn small ghost" data-action="copy" data-platform="kick" type="button">Panoya Kopyala</button>
      </article>

      <button id="btnPublishAll" class="btn primary full" type="button">Tümünü Yayınla</button>
    </section>

  </main>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
