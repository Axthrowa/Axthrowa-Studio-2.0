[package]
name = "yayin-motoru"
version = "0.1.0"
edition = "2021"
description = "Yayın Yönetim Aracı yerel yayın çekirdeği: libobs üzerinde çoklu tuval, paylaşılan kodlayıcı ve hedef başına bağımsız çıktı"
# libobs (GPL-2.0-or-later) çalışma anında bu sürece yüklenir; bu yüzden çekirdek GPL'dir. Panel ayrı bir süreçtir ve
# çekirdekle yalnız stdio üzerinden JSON satırlarıyla konuşur (bkz. docs/STREAMING_ENGINE_DECISION.md ADR-003).
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "yayin-motoru"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# Canlı önizleme akışı (MIT OR Apache-2.0, saf Rust)
jpeg-encoder = "0.6"
libloading = "0.7"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
