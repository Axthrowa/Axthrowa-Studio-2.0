[package]
name = "yayin-yonetim-araci"
version = "1.2.9"
description = "Yayın Yönetim Aracı — OBS Overlay Desktop"
authors = ["axthrowa"]
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
name = "yayin_yonetim_araci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# rustls'ın kripto sağlayıcısı açıkça seçilir (bkz. `tls_saglayicisini_kur`): ağaçta sağlayıcı özelliği yoksa ilk
# wss:// bağlantısı (Kick/Twitch sohbeti) "CryptoProvider belirlenemedi" paniğiyle tüm uygulamayı kapatıyordu.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
http-range = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
percent-encoding = "2"
http = "1"
base64 = "0.22"
sha2 = "0.10"
# Eklenti paketi (zip) açma — zaten bağımlılık ağacında (reqwest/tauri üzerinden)
flate2 = "1"
# OBS WebSocket v5 istemcisi (kalıcı Control Hub bağlantısı)
obws = { version = "0.15", default-features = false, features = ["events"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
tracing = { version = "0.1.44", features = ["log-always"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
ed25519-dalek = "2"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }

# keyring 3 platform deposu seçilmezse sahte (bellek) depoya düşer: sırlar kalıcı olmaz. Her platform kendi deposu.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# (integration tests; runtime WS bot uses tokio-tungstenite above)

# `cargo build` tek başına custom-protocol açmaz → cfg(dev) kalır ve
# pencere localhost:1420'ye gider (ERR_CONNECTION_REFUSED).
# `tauri build` / default feature ile gömülü dist kullanılır.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
