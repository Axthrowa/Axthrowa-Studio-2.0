# Her push ve PR'da: tür denetimi, arayüz ve Rust sınamaları. İmza ve sürüm burada yok: kurulumlar yalnız
# `v1.2.3` etiketiyle release.yml'de derlenip imzalanır (her push'ta üç platform derleyip imzalamak hem yavaş
# hem de sertifikayı gereksiz yere açar).
name: Denetim

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            axbot/package-lock.json
            resonance/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bağımlılıklar
        run: |
          npm ci
          npm ci --prefix axbot
          npm ci --prefix resonance
      - name: Arayüz (tsc + vitest; Studio, AxBoT sunucu ve panel, Resonance)
        run: |
          npm run typecheck
          npm test
      - name: Rust sınamaları
        shell: bash
        run: |
          # tauri::generate_context! paketlenecek arayüz klasörlerinin var olmasını ister
          npm run build
          mkdir -p resonance/dist
          cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Yayın provası (sahte OBS ile başlat, uyarı, mola, bitir)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test yayin_provasi
      - name: Sunucu uçtan uca (gerçek HTTP sunucusu, yalnız yerel sahte hizmetler)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test server_api
      - name: Görsel gerileme (12 ekran, tests/gorsel ile karşılaştırma)
        run: npm run test:gorsel
      - name: Görsel fark resimleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gorsel-fark
          path: test-results/gorsel/
