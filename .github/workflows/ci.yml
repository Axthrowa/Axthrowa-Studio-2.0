# Her push ve PR'da: sunucu tür denetimi ve sınamaları (sunucu, panel, Resonance).
# Bot kullanıcının kendi Node'uyla çalışır (engines >=22.5), bu yüzden en düşük ve güncel sürümde sınanır.
name: Denetim

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: windows (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            resonance/package-lock.json
      - name: Bağımlılıklar
        run: |
          npm ci
          npm ci --prefix resonance
      - name: Sunucu (tsc + vitest)
        working-directory: server
        run: |
          npx tsc --noEmit
          npm test
      - name: Panel (vitest)
        working-directory: client
        run: npm test
      - name: Resonance (vitest)
        working-directory: resonance
        run: npm test
